name: FreeRooms
options:
  bundleIdPrefix: com.freerooms
  deploymentTarget:
    iOS: "17.0"
targets:
  FreeRooms:
    type: application
    platform: iOS
    sources:
      - FreeRooms
    info:
      path: FreeRooms/Info.plist
      properties:
        CFBundleDisplayName: FreeRooms
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freerooms.ios
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
